name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.14
      - name: Install locked dependencies
        run: uv sync --locked --dev --python "${{ matrix.python-version }}"
      - name: Check formatting and lint
        run: |
          uv run --offline ruff format --check .
          uv run --offline ruff check .
      - name: Run offline tests
        run: uv run --offline python -m unittest discover -s tests -v
      - name: Run synthetic demos
        run: |
          uv run --offline watchpost inspect examples/baseline.xml
          uv run --offline watchpost compare examples/baseline.xml examples/after.xml --confirm-same-context
          output_dir="$(mktemp -d)"
          uv run --offline watchpost compare examples/baseline.xml examples/after.xml \
            --confirm-same-context --output "$output_dir/report.md"
          diff -u examples/report.md "$output_dir/report.md"
          uv run --offline watchpost verify examples/report.md examples/baseline.xml examples/after.xml
          uv run --offline watchpost compare examples/baseline.xml examples/after.xml \
            --confirm-same-context --expect examples/expected-deployment.toml
          uv run --offline watchpost compare examples/baseline.xml examples/after.xml \
            --confirm-same-context --format json | python -m json.tool > /dev/null
          uv run --offline watchpost history examples/baseline.xml examples/after.xml \
            examples/rollback.xml --confirm-same-context
      - name: Build and smoke-test the installed wheel
        run: |
          uv build --out-dir "$RUNNER_TEMP/watchpost-dist"
          uv venv "$RUNNER_TEMP/watchpost-wheel" --python "${{ matrix.python-version }}"
          uv pip install --python "$RUNNER_TEMP/watchpost-wheel/bin/python" \
            "$RUNNER_TEMP/watchpost-dist/"*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/watchpost-wheel/bin/python" -I - <<'PY'
          import os
          import tomllib
          from importlib.metadata import metadata
          from pathlib import Path

          expected = tomllib.loads(
              (Path(os.environ["GITHUB_WORKSPACE"]) / "pyproject.toml").read_text()
          )["project"]
          installed = metadata(expected["name"])
          assert installed["Version"] == expected["version"]
          assert installed["License-Expression"] == expected["license"]
          PY
          "$RUNNER_TEMP/watchpost-wheel/bin/watchpost" inspect \
            "$GITHUB_WORKSPACE/examples/baseline.xml"
          "$RUNNER_TEMP/watchpost-wheel/bin/watchpost" compare \
            "$GITHUB_WORKSPACE/examples/baseline.xml" "$GITHUB_WORKSPACE/examples/after.xml" \
            --confirm-same-context --output "$RUNNER_TEMP/wheel-report.md"

  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install uv
        run: python -m pip install uv==0.11.14
      - name: Install locked dependencies
        run: uv sync --locked --dev --python 3.13
      - name: Run offline tests
        run: uv run --offline python -m unittest discover -s tests -v
      - name: Run a synthetic comparison
        run: uv run --offline watchpost compare examples/baseline.xml examples/after.xml --confirm-same-context

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Build the browser site
        run: bash web/build.sh site
      - name: Run the Pyodide smoke test
        run: node web/smoke.mjs site
