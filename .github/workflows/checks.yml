name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: python -m pip install uv==0.11.14
      - name: Install locked dependencies
        run: uv sync --locked --dev --python "${{ matrix.python-version }}"
      - name: Check formatting and lint
        run: |
          uv run --offline ruff format --check .
          uv run --offline ruff check .
      - name: Run offline tests
        run: uv run --offline python -m unittest discover -s tests -v
      - name: Run synthetic demo
        run: uv run --offline watchpost inspect examples/baseline.xml
