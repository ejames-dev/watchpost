name: Publish Python package
run-name: Publish to ${{ inputs.registry }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      registry:
        description: Registry to publish to (test on TestPyPI first)
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi

permissions: {}

concurrency:
  group: publish-${{ inputs.registry }}
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'ejames-dev/watchpost'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Validate registry, source ref, and package identity
        env:
          REGISTRY: ${{ inputs.registry }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          project = tomllib.loads(Path('pyproject.toml').read_text())['project']
          if project['name'] != 'watchpost-cli':
              raise SystemExit('Refusing an unexpected distribution name.')
          registry = os.environ['REGISTRY']
          if registry not in {'testpypi', 'pypi'}:
              raise SystemExit('Unsupported registry.')
          expected_ref = (
              'refs/heads/main' if registry == 'testpypi'
              else f"refs/tags/v{project['version']}"
          )
          if os.environ['GITHUB_REF'] != expected_ref:
              raise SystemExit(f'{registry} publication requires {expected_ref}.')
          PY
          git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Install tools and locked dependencies
        run: |
          python -m pip install uv==0.11.14
          uv sync --locked --dev --python 3.11
      - name: Verify and build once
        run: |
          uv run --offline python -m unittest discover -s tests -v
          uv run --offline ruff format --check .
          uv run --offline ruff check .
          uv build --out-dir dist
          uvx --from 'twine==7.0.0' twine check --strict dist/*
      - name: Smoke-test the exact wheel outside the checkout
        run: |
          uv export --locked --no-dev --no-emit-project --output-file runtime-requirements.txt
          uv venv "$RUNNER_TEMP/wheel-smoke" --python 3.11
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" \
            --require-hashes --requirement runtime-requirements.txt
          uv pip install --python "$RUNNER_TEMP/wheel-smoke/bin/python" --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/watchpost" --help
          "$RUNNER_TEMP/wheel-smoke/bin/watchpost" compare \
            "$GITHUB_WORKSPACE/examples/baseline.xml" "$GITHUB_WORKSPACE/examples/after.xml" \
            --confirm-same-context --output "$RUNNER_TEMP/publish-smoke.md"
      - name: Check the artifact set and record checksums
        shell: bash
        run: |
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          (cd dist && sha256sum *.whl *.tar.gz) > SHA256SUMS
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: distributions
          path: |
            dist/
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ inputs.registry }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: distributions
          path: release-bundle
      - name: Verify the exact downloaded bundle
        working-directory: release-bundle/dist
        run: sha256sum --check ../SHA256SUMS
      - name: Publish to TestPyPI
        if: inputs.registry == 'testpypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release-bundle/dist
          skip-existing: false
          print-hash: true
      - name: Publish to PyPI
        if: inputs.registry == 'pypi'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: release-bundle/dist
          skip-existing: false
          print-hash: true
