[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "watchpost"
version = "0.1.0.dev0"
description = "Local-first, evidence-backed reviews of changes between saved Nmap scans."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["defusedxml>=0.7.1,<0.8"]

[project.scripts]
watchpost = "watchpost:main"

[tool.setuptools]
py-modules = ["watchpost", "watchpost_report"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
